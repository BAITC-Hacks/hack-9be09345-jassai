[project]
name = "career-quest"
version = "0.1.0"
description = "Career Quest local web application — backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
